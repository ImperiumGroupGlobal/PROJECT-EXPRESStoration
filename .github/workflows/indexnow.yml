name: Notify search engines

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        env:
          HOST: project-expresstoration.pages.dev
          KEY: b7c4f19e82a64d91a3f5c07e6d2b8149
        run: |
          set -eu
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @- <<JSON
          {
            "host": "$HOST",
            "key": "$KEY",
            "keyLocation": "https://$HOST/$KEY.txt",
            "urlList": [
              "https://$HOST/",
              "https://$HOST/methodology.html",
              "https://$HOST/precedents.html",
              "https://$HOST/pilot-program.html",
              "https://$HOST/faq.html",
              "https://$HOST/license.html"
            ]
          }
          JSON
